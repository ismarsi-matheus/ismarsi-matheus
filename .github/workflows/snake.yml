name: Snake

on:
  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Generate Snake
        uses: Platane/snk@v2.0.0
        with:
          github_user: ismarsi-matheus
          svg_out: output/github-snake.svg
          svg_dark_out: output/github-snake-dark.svg
